# Render.com — free tier deploy for Comment Card.
# The database is a single SQLite file stored on a persistent disk,
# so comments and accounts survive restarts and redeploys.
services:
  - type: web
    name: comment-card
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: comment-card-data
      mountPath: /var/data
      sizeGB: 1
