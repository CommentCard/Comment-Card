# Fly.io — deploy for Comment Card.
# Usage:
#   fly launch --no-deploy   (creates the app; keep the generated fly.toml settings)
#   fly volumes create comment_card_data --size 1 --region <your region>
#   fly deploy
# The SQLite database lives on the attached volume, so data survives redeploys.

app = "comment-card"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  COOKIE_SECURE = "1"
  DATA_DIR = "/data"

[[mounts]]
  source = "comment_card_data"
  destination = "/data"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    path = "/"
    interval = "30s"
    timeout = "5s"
